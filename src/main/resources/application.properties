# Spring Boot Configuration
server.port=8080

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
spring.datasource.username=photoalbum
spring.datasource.password=photoalbum
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Application Configuration - File Upload Validation
app.file-upload.max-file-size-bytes=10485760
app.file-upload.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp
app.file-upload.max-files-per-upload=10

# Logging
logging.level.com.photoalbum=DEBUG
logging.level.org.springframework.web=DEBUG

# Azure OpenAI Configuration
# To enable AI-powered image descriptions:
#   1. Set azure.openai.enabled=true
#   2. Fill in your Azure OpenAI resource endpoint and API key
#   3. Set the name of your GPT-4o (or other vision-capable) deployment
# When enabled=false the description section is hidden entirely from the UI.
azure.openai.enabled=false
azure.openai.endpoint=https://YOUR_RESOURCE_NAME.openai.azure.com
azure.openai.api-key=YOUR_API_KEY
azure.openai.deployment-name=gpt-4o
azure.openai.api-version=2024-02-15-preview

